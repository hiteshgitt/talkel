# Local development services. Ports avoid the other projects already running on this machine.
#   docker compose up -d
name: speakai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: speakai
      POSTGRES_PASSWORD: speakai_dev
      POSTGRES_DB: speakai
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakai -d speakai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6381:6379"
    restart: unless-stopped

  # Catches every email the API sends in development (verification, password reset).
  # Web UI: http://localhost:8027
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1027:1025"
      - "127.0.0.1:8027:8025"
    restart: unless-stopped

volumes:
  postgres-data:
