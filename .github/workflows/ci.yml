name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: speakai
          POSTGRES_PASSWORD: speakai_dev
          POSTGRES_DB: speakai_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U speakai -d speakai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://speakai:speakai_dev@localhost:5436/speakai_test
      # Only for `prisma generate`/typecheck of packages/db; e2e uses TEST_DATABASE_URL.
      DATABASE_URL: postgresql://speakai:speakai_dev@localhost:5436/speakai_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@speakai/contracts --filter=@speakai/db

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: API end-to-end tests (real Postgres, fake AI providers)
        run: pnpm --filter @speakai/api test:e2e

      - name: Web production build
        run: pnpm --filter @speakai/web build
        env:
          API_INTERNAL_URL: http://127.0.0.1:4810
          NEXT_PUBLIC_WEB_URL: http://localhost:3100

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
